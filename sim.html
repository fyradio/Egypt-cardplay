<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對戰畫面 · 太陽船之書</title>
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/battle.css">
</head>
<body>
<div class="bar">
  <button id="play" class="main" type="button">▶ 播放</button>
  <button id="pause" type="button">⏸ 暫停</button>
  <button id="restart" type="button">↻ 重新開始</button>
  <button id="prev" type="button" title="退一步">◀</button>
  <button id="next" type="button" title="進一步">▶</button>
  <select id="speed" aria-label="播放速度"><option value="0.6">慢</option><option value="1" selected>中</option><option value="1.8">快</option><option value="4">極快</option></select>
  <label class="chk"><input type="checkbox" id="peek"> 看乙的手牌</label>
  <label class="chk"><input type="checkbox" id="explain"> 解說欄</label>
  <button id="logbtn" type="button">紀錄</button>
  <a class="lnk" href="sim-text.html">文字版</a>
  <span class="meta">第 <b id="m-turn">0</b> 回合・<b id="m-step">0</b>／<span id="m-total">0</span>・種子 <b id="m-seed"></b></span>
</div>
<div id="wrap"><div id="stage"></div></div>
<div id="drawer"><div class="dh"><b>戰況紀錄</b><button id="dclose" type="button">關閉</button></div><div id="dlog"></div></div>

<script src="js/glyphs.js"></script>
<script src="js/cardart.js"></script>
<script src="js/cardart-ext.js"></script>
<script src="js/cardart-v2.js"></script>
<script src="js/cardview.js"></script>
<script src="data/cards-sample.js"></script>
<script src="data/cards-evo.js"></script>
<script src="data/cards-trinity.js"></script>
<script src="data/cards-fusion.js"></script>
<script src="data/cards-field.js"></script>
<script src="data/cards-battle.js"></script>
<script src="data/sim-cards.js"></script>
<script src="js/sim-engine.js"></script>
<script src="js/battle-ui.js"></script>
</body>
</html>
